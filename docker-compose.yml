version: '3.8'

services:
  mongo:
    image: mongo:latest
    container_name: pace-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      pace-network:
        aliases:
          - mongo
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pace-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - pace-network

networks:
  pace-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
