services:
  mongo:
    image: mongo:latest
    container_name: pace-mongodb
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pace-backend
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - ./backend/.env.production
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
    driver: local
