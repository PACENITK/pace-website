name: Deploy PACE Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: changes
        run: |
          if git rev-parse "${{ github.event.before }}" >/dev/null 2>&1; then
            if git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- backend/ docker-compose.yml .github/workflows/deploy.yml; then
              echo "backend_changed=false" >> "$GITHUB_OUTPUT"
            else
              echo "backend_changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            # No usable "before" ref (e.g. force-push, new branch) - rebuild to be safe
            echo "backend_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Node dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Copy files to the live folder
        run: cp -r dist/* /var/www/pace/

      - name: Write backend production env file
        if: steps.changes.outputs.backend_changed == 'true'
        run: |
          cat > backend/.env.production <<'EOF'
          PORT=5000
          NODE_ENV=production
          MONGO_URI=mongodb://mongo:27017/pace
          JWT_ACCESS_SECRET=${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET=${{ secrets.JWT_REFRESH_SECRET }}
          JWT_ACCESS_EXPIRY=15m
          JWT_REFRESH_EXPIRY=7d
          IRIS_CLIENT_ID=${{ secrets.IRIS_CLIENT_ID }}
          IRIS_CLIENT_SECRET=${{ secrets.IRIS_CLIENT_SECRET }}
          IRIS_CALLBACK_URL=https://pace.nitk.ac.in/auth/iris/callback
          IRIS_AUTHORIZATION_URL=https://iris.nitk.ac.in/oauth/authorize
          IRIS_TOKEN_URL=https://iris.nitk.ac.in/oauth/token
          IRIS_PROFILE_URL=https://iris.nitk.ac.in/api/v1/profile
          FRONTEND_URL=https://pace.nitk.ac.in
          SUPER_ADMIN_EMAIL=${{ secrets.SUPER_ADMIN_EMAIL }}
          SUPER_ADMIN_NAME=${{ secrets.SUPER_ADMIN_NAME }}
          EOF
          chmod 600 backend/.env.production

      - name: Build and restart backend container stack
        if: steps.changes.outputs.backend_changed == 'true'
        run: docker compose up -d --build backend mongo